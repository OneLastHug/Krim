name: deployment signal

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create deployment signal (serverless-remote-deploy)
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments" \
            -d "{\"ref\":\"${GITHUB_SHA}\",\"description\":\"serverless-remote-deploy signal\"}" \
            -o /tmp/dep.json -w "POST_HTTP=%{http_code}\n"
        env:
          GITHUB_TOKEN: ${{ github.token }}

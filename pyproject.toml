[tool.hatch.build.targets.sdist]
# 仅分发Python与UI重建所需源码、元数据和第三方许可；不包含测试与开发环境。
only-include = [
  "pyproject.toml",
  "README.md",
  ".gitignore",
  "src/krim_agent",
  "frontend/src",
  "frontend/scripts",
  "frontend/package.json",
  "frontend/package-lock.json",
  "frontend/index.html",
  "frontend/tsconfig.json",
  "frontend/vite.config.ts",
  "frontend/vitest.config.ts",
  "frontend/THIRD-PARTY-NOTICES.txt",
]
exclude = [
  "**/.cache/**",
  "**/.vite/**",
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.pyd",
]
[tool.pytest.ini_options]
testpaths = ["tests/core", "tests/agent_core", "tests/safe_eval"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -p no:cacheprovider"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["krim_agent"]
mypy_path = "src"

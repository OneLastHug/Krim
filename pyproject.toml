[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "krim-agent"
version = "0.4.0a1"
description = "Krim Agent: persistent sessions, controlled runs and rule evaluations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.13,<3", "sqlalchemy>=2.0,<2.1", "aiosqlite>=0.20,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "referencing>=0.37,<0.38", "httpx>=0.27,<1", "httpcore==1.0.9", "websockets==15.0.1", "ai[openai]==0.9.0", "openai==2.34.0", "PyYAML>=6,<7"]
[project.optional-dependencies]
mcp = ["mcp==1.30.0"]
personal-mcp = ["mcp==1.30.0", "cryptography==50.0.2"]

[project.scripts]
krim = "krim_agent.cli:main"
krim-eval = "krim_agent.evaluation.cli:main"
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.15,<2", "types-jsonschema>=4.23", "types-PyYAML>=6,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "krim-agent"
version = "0.2.0a1"
description = "Krim Agent agent core: offline controlled runs and private trace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<2.1", "aiosqlite>=0.20,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "referencing>=0.37,<0.38", "httpx>=0.27,<1"]
[project.scripts]
krim = "krim_agent.cli:main"
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.15,<2", "types-jsonschema>=4.23"]
[tool.hatch.build.targets.wheel]
only-include = [
  "src/krim_agent/contracts.py",
  "src/krim_agent/composition.py",
  "src/krim_agent/runtime/contracts.py",
  "src/krim_agent/runtime/engine.py",
  "src/krim_agent/runtime/service.py",
  "src/krim_agent/runtime/facts.py",
  "src/krim_agent/tools/executor.py",
  "src/krim_agent/storage/__init__.py",
  "src/krim_agent/storage/models.py",
  "src/krim_agent/storage/sqlite.py",
  "src/krim_agent/__init__.py",
  "src/krim_agent/config.py",
  "src/krim_agent/usage.py",
  "src/krim_agent/runtime/__init__.py",
  "src/krim_agent/providers/__init__.py",
  "src/krim_agent/providers/types.py",
  "src/krim_agent/providers/fake.py",
  "src/krim_agent/tools/__init__.py",
  "src/krim_agent/tools/core.py",
  "src/krim_agent/tools/registry.py",
  "src/krim_agent/tools/output.py",
  "src/krim_agent/tools/builtins.py",
  "src/krim_agent/cli.py",
  "src/krim_agent/client.py",
  "src/krim_agent/observability.py",
  "src/krim_agent/api/__init__.py",
  "src/krim_agent/api/server.py",
  "src/krim_agent/api/boundary.py",
  "src/krim_agent/api/web.py",
  "src/krim_agent/sdk/__init__.py",
  "src/krim_agent/sdk/text.py",
  "src/krim_agent/web/index.html",
  "src/krim_agent/web/assets/styles.css",
  "src/krim_agent/web/assets/app.js",
  "src/krim_agent/web/THIRD-PARTY-NOTICES.txt",
  "src/krim_agent/__main__.py",
  "src/krim_agent/evaluation/__init__.py",
  "src/krim_agent/evaluation/types.py",
  "src/krim_agent/evaluation/trace_cases.py",
  "src/krim_agent/evaluation/targets.py",
  "src/krim_agent/evaluation/runner.py",
  "src/krim_agent/evaluation/scorers.py",
  "src/krim_agent/evaluation/regression.py",
  "src/krim_agent/evaluation/service.py",
  "src/krim_agent/providers/eval_script.py"
]
sources = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests/core"]
python_files = ["test_contracts.py", "test_runtime.py", "test_tool_boundaries.py", "test_run_facts.py", "test_storage.py", "test_read_sides.py", "test_package.py", "test_trace_cases.py", "test_evaluation.py", "test_eval_storage.py", "test_regression.py", "test_eval_read_sides.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -p no:cacheprovider"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["krim_agent"]
mypy_path = "src"

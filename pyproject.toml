[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "krim-agent"
version = "0.1.0.dev0"
description = "Python-first embedded agent runtime"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "aiosqlite>=0.20,<1",
    "uvicorn>=0.30,<1",
    "jsonschema>=4.23,<5",
    "referencing>=0.37,<0.38",
    "httpx>=0.27,<1",
    "alembic>=1.14,<2",
    "mcp>=1.20,<2",
    "cryptography>=42,<51",
    "langcodes>=3.5,<4",
    "tiktoken>=0.13,<1",
]

[project.scripts]
krim = "krim_agent.cli:main"

[project.optional-dependencies]
observability = ["opentelemetry-api==1.45.0"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
    "mypy>=1.15,<2",
    "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/krim_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/krim_agent/protocol/bridge.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["krim_agent"]
mypy_path = "src"
